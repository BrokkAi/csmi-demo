name: Scenario validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  external-normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Rebuild and verify the shared fixture
        run: |
          ./scenarios/external-normalize/scripts/build-fixture.sh
          ./scenarios/external-normalize/scripts/verify.py
      - name: Reject stale binary and pack identities
        run: |
          stale_binary=$(mktemp -d)
          cp -R scenarios/external-normalize/. "$stale_binary/"
          truncate -s -1 "$stale_binary/analyzer-input/lib/external-normalize-1.0.0.jar"
          if ./scenarios/external-normalize/scripts/verify.py "$stale_binary"; then
            echo "verifier accepted a stale binary identity" >&2
            exit 1
          fi

          stale_pack=$(mktemp -d)
          cp -R scenarios/external-normalize/. "$stale_pack/"
          truncate -s -1 "$stale_pack/pack/semantic-document.json"
          if ./scenarios/external-normalize/scripts/verify.py "$stale_pack"; then
            echo "verifier accepted a stale pack identity" >&2
            exit 1
          fi
      - name: Compile analyzer input against only the opaque JAR
        run: |
          build_dir=$(mktemp -d)
          javac --release 17 -encoding UTF-8 \
            -classpath scenarios/external-normalize/analyzer-input/lib/external-normalize-1.0.0.jar \
            -d "$build_dir" \
            scenarios/external-normalize/analyzer-input/src/main/java/ai/brokk/csmi/demo/ScenarioApplication.java
      - name: Validate the Joern adapter and result contract
        run: |
          python3 -m pip install --requirement consumers/joern/requirements-validation.txt
          python3 -m unittest discover -s consumers/joern -p 'test_*.py' -v

  codeql-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Install the pinned CodeQL bundle
        env:
          BUNDLE_URL: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.26.4/codeql-bundle-linux64.tar.zst
          BUNDLE_SHA256: a9872c9075f85374a8d03546263c6dc01fde50a29baea9fc08dcc6b25cc2efd5
        run: |
          curl --fail --location --retry 3 "$BUNDLE_URL" --output "$RUNNER_TEMP/codeql.tar.zst"
          echo "$BUNDLE_SHA256  $RUNNER_TEMP/codeql.tar.zst" | sha256sum --check --strict
          tar --use-compress-program=unzstd -xf "$RUNNER_TEMP/codeql.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/codeql" >> "$GITHUB_PATH"
      - name: Reproduce the paired CodeQL evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./consumers/codeql/scripts/run-shared-scenario.sh "$RUNNER_TEMP/codeql-results"
      - name: Reject stale retained CodeQL evidence
        run: |
          diff -ru consumers/codeql/results "$RUNNER_TEMP/codeql-results"
          python3 consumers/codeql/scripts/verify-results.py
      - name: Retain the reproduced results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-consumer-results
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 14

  joern-external-normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Install pinned Joern 4.0.592
        run: |
          archive="$RUNNER_TEMP/joern-cli-linux-x86_64.zip"
          curl --fail --location --retry 3 \
            https://github.com/joernio/joern/releases/download/v4.0.592/joern-cli-linux-x86_64.zip \
            --output "$archive"
          echo '1147db0a9b539d635c77174a22bcbe850133633f279871db8d815aa7479a7db6  '"$archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/joern"
      - name: Run the same-CPG Joern pack-off and pack-on pair
        run: |
          python3 -m pip install --requirement consumers/joern/requirements-validation.txt
          output="$RUNNER_TEMP/joern-result"
          consumers/joern/run.sh \
            scenarios/external-normalize \
            "$RUNNER_TEMP/joern/joern-cli" \
            "$JAVA_HOME" \
            "$output"
          jq -e '
            .resultFormatVersion == "csmi-demo-consumer-result/1" and
            .status == "complete" and
            .pack.state == "off" and
            .counts.truePositive == 1 and
            .counts.falsePositive == 1 and
            .counts.falseNegative == 0
          ' "$output/pack-off.json" >/dev/null
          jq -e '
            .resultFormatVersion == "csmi-demo-consumer-result/1" and
            .status == "complete" and
            .pack.state == "on" and
            .counts.truePositive == 1 and
            .counts.trueNegative == 1 and
            .counts.falsePositive == 0 and
            .counts.falseNegative == 0 and
            .analysis.cpgSha256 != null and
            .analysis.cpgSha256 == $input_filename
          ' --arg input_filename "$(jq -r '.analysis.cpgSha256' "$output/pack-off.json")" "$output/pack-on.json" >/dev/null
