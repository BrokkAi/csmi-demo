name: Scenario validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  external-normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Rebuild and verify the shared fixture
        run: |
          ./scenarios/external-normalize/scripts/build-fixture.sh
          ./scenarios/external-normalize/scripts/verify.py
      - name: Reject stale binary and pack identities
        run: |
          stale_binary=$(mktemp -d)
          cp -R scenarios/external-normalize/. "$stale_binary/"
          truncate -s -1 "$stale_binary/analyzer-input/lib/external-normalize-1.0.0.jar"
          if ./scenarios/external-normalize/scripts/verify.py "$stale_binary"; then
            echo "verifier accepted a stale binary identity" >&2
            exit 1
          fi

          stale_pack=$(mktemp -d)
          cp -R scenarios/external-normalize/. "$stale_pack/"
          truncate -s -1 "$stale_pack/pack/semantic-document.json"
          if ./scenarios/external-normalize/scripts/verify.py "$stale_pack"; then
            echo "verifier accepted a stale pack identity" >&2
            exit 1
          fi
      - name: Compile analyzer input against only the opaque JAR
        run: |
          build_dir=$(mktemp -d)
          javac --release 17 -encoding UTF-8 \
            -classpath scenarios/external-normalize/analyzer-input/lib/external-normalize-1.0.0.jar \
            -d "$build_dir" \
            scenarios/external-normalize/analyzer-input/src/main/java/ai/brokk/csmi/demo/ScenarioApplication.java

  flowdroid-pack-off:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumers/flowdroid
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.16+8.0.LTS'
          cache: maven
      - name: Verify adapter and real pack-off scenario
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Emit and check machine-readable pack-off evidence
        run: |
          ./mvnw --batch-mode --no-transfer-progress -q compile exec:java \
            -Dexec.mainClass=ai.brokk.csmi.flowdroid.FlowDroidPackOffCli \
            -Dexec.args="--scenario ../../scenarios/external-normalize --output results/pack-off.json --pack off --consumer-revision ${GITHUB_SHA}"
          jq -e '
            .status == "complete" and
            .pack.enabled == false and
            .pack.status == "unavailable" and
            .counts == {
              "truePositive": 0,
              "trueNegative": 1,
              "falsePositive": 0,
              "falseNegative": 1,
              "total": 2
            } and
            .metrics.precision.defined == false and
            .metrics.precision.value == null and
            .termination.status == "success" and
            .termination.externalClassExcludedWithoutBodies == true
          ' results/pack-off.json
