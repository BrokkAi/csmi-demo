name: FlowDroid consumer

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consumers/flowdroid
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.16+8'
          cache: maven
      - name: Verify adapter and real pack-off/on scenario
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Emit and validate machine-readable pack-off/on evidence
        run: ./scripts/run-shared-scenario.sh
